services:
  sales-api:
    build:
      context: .
      dockerfile: Dockerfile.sales_api
    container_name: sales-api-cont
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8088"
    volumes:
      - ./data:/app/data
      - ./sales_api:/app/sales_api
      - ./.env:/app/.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - SALES_API_URL=http://sales-api:8088
      - PYTHONUNBUFFERED=1
      - DION_LLM_BASE_URL=${DION_LLM_BASE_URL:-https://ai.dion.vn/api/v1}
      - DION_LLM_API_KEY=${DION_LLM_API_KEY:-}
      - DION_LLM_MODEL=${DION_LLM_MODEL:-balanced}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_SALES_CHAT_ID=${TELEGRAM_SALES_CHAT_ID:-}
    networks:
      - sales-network

  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
    container_name: openclaw-cont
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SALES_API_URL=http://sales-api:8088
      - DION_LLM_BASE_URL=${DION_LLM_BASE_URL:-https://ai.dion.vn/api/v1}
      - DION_LLM_API_KEY=${DION_LLM_API_KEY:-}
      - DION_LLM_MODEL=${DION_LLM_MODEL:-balanced}
      - CUSTOM_BASE_URL=${CUSTOM_BASE_URL:-https://ai.dion.vn/api/v1}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - CUSTOM_MODEL_ID=${CUSTOM_MODEL_ID:-balanced}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_SALES_CHAT_ID=${TELEGRAM_SALES_CHAT_ID:-}
    volumes:
      - ./openclaw-config:/root/.openclaw
    networks:
      - sales-network
    depends_on:
      - sales-api

networks:
  sales-network:
    name: sales-network
    driver: bridge
